version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - WATSONX_API_KEY=${WATSONX_API_KEY}
      - WATSONX_PROJECT_ID=${WATSONX_PROJECT_ID}
      - WATSONX_ENDPOINT_URL=${WATSONX_ENDPOINT_URL}
      - GRANITE_MODEL_ID=${GRANITE_MODEL_ID}
      - APP_PORT=8000
    volumes:
      - ./backend:/app
      - ./docs:/app/docs
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    networks:
      - tumorboard

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:8000
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: npm run dev -- --host 0.0.0.0
    depends_on:
      - backend
    networks:
      - tumorboard

networks:
  tumorboard:
    driver: bridge

